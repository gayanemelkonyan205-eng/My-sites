name: Static portal regression checks
on:
  push:
    branches: [main]
    paths: ['*.js', '*.html', '*.css', 'tests/**', '.github/workflows/static-portal-ci.yml']
  pull_request:
    paths: ['*.js', '*.html', '*.css', 'tests/**', '.github/workflows/static-portal-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests --no-audit --no-fund
      - run: npm test --prefix tests
      - run: node tests/syntax-check.mjs
